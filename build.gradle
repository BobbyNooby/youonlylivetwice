plugins {
    id 'net.fabricmc.fabric-loom' version '1.19-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

loom {
    mods {
        "you-only-live-twice" {
            sourceSet sourceSets.main
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "you-only-live-twice-gametest"
        enableClientGameTests = true
        eula = true // Bob agreed to the Minecraft EULA in chat (spec section 15)
    }
}

loom.runs.named("gameTest") { run ->
    // Without a report file the GameTest results only exist in the console log
    run.systemProperties.put("fabric-api.gametest.report-file",
            layout.buildDirectory.file("test-results/gameTest/TEST-gameTest.xml").map { it.asFile.absolutePath })
    // Gradle's -D flags don't reach the forked test server, so the flake-hunt ones are handed over here
    ["filter", "verify"].each { key ->
        def value = System.getProperty("fabric-api.gametest." + key)
        if (value) {
            run.systemProperties.put("fabric-api.gametest." + key, value)
        }
    }
}

// A production client only loads mods from jars, so the test mod gets its own
def gametestJar = tasks.register("gametestJar", Jar) {
    archiveClassifier = "gametest"
    from sourceSets.gametest.output
}

// useXVFB is left at Loom's default: on for Linux CI, off elsewhere
tasks.register("runProductionClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(gametestJar)
    jvmArgs.add("-Dfabric.client.gametest")
    // Same folder as Loom's clientGameTest run, so the EULA it accepts covers the in-process server too
    runDir = layout.buildDirectory.dir("run/clientGameTest")
    dependsOn("acceptGameTestEula")
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation include("org.xerial:sqlite-jdbc:${project.sqlite_jdbc_version}")
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
