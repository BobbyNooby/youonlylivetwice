# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: store test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/
            build/test-results/
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

  client_game_test:
    runs-on: ubuntu-24.04
    # A client that can't open a window hangs instead of exiting
    timeout-minutes: 30
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # OpenGL finds no GLX visual under xvfb, so the client falls back to Vulkan on Mesa's software driver
      - name: install xvfb and software vulkan
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers
      - name: run client game tests
        run: ./gradlew runProductionClientGameTest
      - name: store screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-screenshots
          path: build/run/clientGameTest/screenshots
