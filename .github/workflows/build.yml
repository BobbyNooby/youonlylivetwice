# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  pull_request:
  push:
  # Manual run for hunting flaky tests: filter picks GameTests by name,
  # verify repeats each of them 100 times per rotation, and client adds the client tests
  workflow_dispatch:
    inputs:
      filter:
        description: GameTest id pattern, e.g. you-only-live-twice-gametest:lockout_game_tests_* (empty runs everything)
        type: string
        required: false
      verify:
        description: Repeat the selected GameTests to find flakes (needs a filter; every GameTest repeated can't finish in time)
        type: boolean
        default: false
      client:
        description: Also run the client tests (a filter or verify only changes the server GameTests)
        type: boolean
        default: false

# Each push's run is that commit's proof, so pushes get a group per commit (a queued run is otherwise
# replaced by the next one), and each manual run one of its own, since flake hunts start several on one commit; only
# superseded pull request runs are cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ github.event_name != 'pull_request' && format('-{0}', github.sha) || '' }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Lets the test-report step publish its check run
    permissions:
      contents: read
      checks: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: setup jdk
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The action only saves its cache on the default branch (release) unless told, and every push here is to dev
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        env:
          GAMETEST_FILTER: ${{ inputs.filter }}
          GAMETEST_VERIFY: ${{ inputs.verify }}
        run: |
          if [ "$GAMETEST_VERIFY" = "true" ] && [ -z "$GAMETEST_FILTER" ]; then
            echo "::error::verify needs a filter: repeating every GameTest would run past the job's 30 minutes"
            exit 1
          fi
          args=()
          if [ -n "$GAMETEST_FILTER" ]; then args+=("-Dfabric-api.gametest.filter=$GAMETEST_FILTER"); fi
          if [ "$GAMETEST_VERIFY" = "true" ]; then args+=("-Dfabric-api.gametest.verify=true"); fi
          # --continue keeps JUnit running after a GameTest failure
          ./gradlew build --continue "${args[@]}"
      - name: summarise failed tests
        if: always()
        # A fork's pull request gets a read-only token; the summary must never turn a build red
        continue-on-error: true
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: build/test-results/**/*.xml
          # The check belongs to the commit, so a manual run on the same commit gets its own rather than replacing the push's
          check_name: server tests${{ github.event_name == 'workflow_dispatch' && ' (manual)' || '' }}
          include_passed: false
          # A row per failed test in the job summary, not only in the check's annotations
          detailed_summary: true
          fail_on_failure: false
          require_tests: false
      - name: store test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/
            build/test-results/
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  client_game_test:
    # Every push and pull request; a manual run only when asked for
    if: github.event_name != 'workflow_dispatch' || inputs.client
    runs-on: ubuntu-24.04
    # A client that can't open a window hangs instead of exiting
    timeout-minutes: 30
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: setup jdk
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # OpenGL finds no GLX visual under xvfb, so the client falls back to Vulkan on Mesa's software driver
      # The runner's Ubuntu mirror sometimes fails to resolve for a few minutes, so try again before giving up
      - name: install xvfb and software vulkan
        run: |
          for try in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 xvfb mesa-vulkan-drivers && exit 0
            echo "apt failed on try $try, waiting before the next one"
            sleep 60
          done
          exit 1
      - name: run client game tests
        run: ./gradlew runProductionClientGameTest
      - name: store screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-screenshots
          path: build/run/clientGameTest/screenshots
      - name: store client logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: client-logs
          path: |
            build/run/clientGameTest/logs
            build/run/clientGameTest/crash-reports

  # A push to release whose tests all pass makes a draft release of its jar, tagged v<mod_version>, with
  # .github/release-notes.md as its text. A draft stays private until it is published on GitHub, and until then each
  # push gives it the new jar and text. A published version gets nothing new, so raise mod_version and rewrite the
  # notes for the next release.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: [build, client_game_test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: get the tested jar
        uses: actions/download-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          tag="v$version"
          title="You Only Live Twice $version for Minecraft $minecraft"
          jar="build/libs/you-only-live-twice-$version.jar"
          # A draft has no tag yet, so the release list is read rather than the tag: true for a draft, false once published
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | .draft")
          if [ "$draft" = "false" ]; then
            echo "$tag is published already; raise mod_version in gradle.properties for a new release"
          elif [ "$draft" = "true" ]; then
            gh release upload "$tag" "$jar" --clobber
            gh release edit "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file .github/release-notes.md
          else
            gh release create "$tag" "$jar" --draft --target "$GITHUB_SHA" --title "$title" --notes-file .github/release-notes.md
          fi
