// YOLT Mending: the Mending nerf as a mod of its own. gradle/mod.gradle has the build every mod besides YOLT shares.
plugins {
    id 'net.fabricmc.fabric-loom'
}

ext.modId = 'yolt-mending'
ext.sharedPackage = 'bobbynooby.dev.mending.shared'
// A real client joins a server with only this mod, and opens a single-player world with it
ext.clientTests = true
apply from: rootProject.file('gradle/mod.gradle')
