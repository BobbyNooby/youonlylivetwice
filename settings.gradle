pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// The tiny mods, each a mod of its own that YOLT Hardcore ships inside its jar, and so YOLT too
['anvil', 'mending', 'elytra'].each { name ->
	include name
	project(":$name").projectDir = file("extras/$name")
}

// The coordinate offset, a mod of its own that YOLT also ships inside its jar
include 'coordinates'

// The hardcore layer, a mod of its own that YOLT also ships inside its jar
include 'hardcore'
