// The build every mod besides You Only Live Twice shares. A mod's build.gradle sets ext.modId, ext.sharedPackage if it
// uses shared/ and ext.clientTests if it has client GameTests, and applies this file. Each mod builds its own jar for
// servers that want only it, and the same jar ships inside You Only Live Twice's (a tiny mod's inside YOLT Hardcore's,
// which YOLT's holds). The versions all come from the root gradle.properties.

// Not called modId: the modId line in configureTests below would then set this variable, not the test mod's id
def id = project.ext.modId
// The package this mod compiles the shared source under, such as bobbynooby.dev.anvils.shared, or null for a mod that
// uses nothing in shared/
def sharedPackage = project.ext.has('sharedPackage') ? project.ext.sharedPackage : null
// True for a mod with client GameTests of its own, which a real client runs against this mod's jar alone
def clientTests = project.ext.has('clientTests') && project.ext.clientTests

version = project.mod_version
group = project.maven_group

base {
    archivesName = id
}

// The shared source, compiled into this mod under its own package, so no two jars hold a class of the same name. A Sync,
// not a Copy, so a file taken out of shared/ doesn't live on in the copy and the jar.
if (sharedPackage != null) {
    def copyShared = tasks.register("copyShared", Sync) {
        from rootProject.file("shared/src/main/java")
        into layout.buildDirectory.dir("generated/sources/shared/java")
        eachFile { it.path = it.path.replace("bobbynooby/dev/shared", sharedPackage.replace('.', '/')) }
        filter { String line -> line.replace("bobbynooby.dev.shared", sharedPackage) }
        // The filter reads and writes text, so the charset is pinned rather than left to the machine's default
        filteringCharset = 'UTF-8'
        includeEmptyDirs = false
        inputs.property("sharedPackage", sharedPackage)
    }
    sourceSets.main.java.srcDir(copyShared)
}

loom {
    mods {
        "$id" {
            sourceSet sourceSets.main
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "${id}-gametest"
        // Only a mod that sets ext.clientTests has client GameTests. The root project's client tests check what YOLT,
        // with every mod inside it, shows a real client; a mod's own check what it shows with no YOLT on the server.
        enableClientGameTests = clientTests
        eula = true // Bob agreed to the Minecraft EULA in chat (spec section 15)
    }
}

loom.runs.named("gameTest") { run ->
    // Without a report file the GameTest results only exist in the console log
    run.systemProperties.put("fabric-api.gametest.report-file",
            layout.buildDirectory.file("test-results/gameTest/TEST-gameTest.xml").map { it.asFile.absolutePath })
}

if (clientTests) {
    // A production client only loads mods from jars, so the test mod gets its own
    def gametestJar = tasks.register("gametestJar", Jar) {
        archiveClassifier = "gametest"
        from sourceSets.gametest.output
    }

    // The projects whose client runs come before this mod's: the root, YOLT's, then each mod with client tests set up
    // before this one. Projects are set up one at a time, the root first.
    def modsBefore = rootProject.ext.has('modsWithClientTests') ? rootProject.ext.modsWithClientTests : []
    rootProject.ext.modsWithClientTests = modsBefore + [project.path]
    def before = [rootProject] + modsBefore.collect { rootProject.project(it) }

    // A script applied from a file can't see the plugin's classes by name, so the task type comes from Loom's loader
    def productionRun = Class.forName("net.fabricmc.loom.task.prod.ClientProductionRunTask", true,
            plugins.findPlugin("net.fabricmc.fabric-loom").class.classLoader)

    // As the root project's: this mod's jar, which Loom adds, with the test mod and Fabric API, and nothing of YOLT
    tasks.register("runProductionClientGameTest", productionRun) {
        mods.from(gametestJar)
        jvmArgs.add("-Dfabric.client.gametest")
        // Same folder as Loom's clientGameTest run, so the EULA it accepts covers the in-process server too
        runDir = layout.buildDirectory.dir("run/clientGameTest")
        dependsOn("acceptGameTestEula")
        // After every client run before it, so whatever Gradle runs in parallel, one window opens at a time
        before.each { mustRunAfter(it.tasks.named { name -> name == "runProductionClientGameTest" }) }
        // Every project's downloadAssets writes the one assets folder in Gradle's cache that every client run reads,
        // and Gradle stops a build in which a run isn't ordered after each of them
        before.each { mustRunAfter(it.tasks.named { name -> name == "downloadAssets" }) }
    }
    // The same the other way: the runs before this one come after this mod's download
    def download = tasks.named { name -> name == "downloadAssets" }
    before.each {
        it.tasks.named { name -> name == "runProductionClientGameTest" }.configureEach { mustRunAfter(download) }
    }

    dependencies {
        productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.compilerArgs.add("-Xlint:deprecation")
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_$id" }
    }
}
